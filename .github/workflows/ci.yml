name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"
  DEBUG: "False"
  DB_NAME: "test_db"
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  DB_HOST: "localhost"
  DB_PORT: "5432"

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs/requirements-dev.txt

      - name: Run Black (format check)
        run: black --check --diff src/ tests/

      - name: Run Flake8 (lint)
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Run isort (import order)
        run: isort --check-only --diff src/ tests/

      - name: Run Bandit (security)
        run: bandit -r src/ -x tests/ -ll

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs/requirements-dev.txt

      - name: Run migrations
        working-directory: src/backend
        run: python manage.py migrate --no-input
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "True"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [lint, test]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs/requirements-dev.txt

      - name: Run migrations
        working-directory: src/backend
        run: python manage.py migrate --no-input
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Start Django server
        working-directory: src/backend
        run: |
          python manage.py runserver 8000 &
          sleep 5
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Start Celery worker
        run: |
          celery -A backend worker --loglevel=info &
          sleep 3
        working-directory: src/backend
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Run E2E tests
        run: |
          pytest tests/test_e2e.py --e2e -v
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Collect logs on failure
        if: failure()
        run: |
          cat src/backend/logs/*.log || echo "No logs found"

  migration:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reqs/requirements-dev.txt

      - name: Run migrations
        working-directory: src/backend
        run: |
          python manage.py migrate --no-input
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Test migration command (dry-run)
        working-directory: src/backend
        run: |
          python manage.py migrate_scanning_data --dry-run
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0

      - name: Check for migration conflicts
        working-directory: src/backend
        run: |
          python manage.py makemigrations --check --dry-run

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: securesys-auditor:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
