[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Django settings
DJANGO_SETTINGS_MODULE = backend.settings

# Coverage settings
[coverage:run]
branch = True
source = src
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */venv/*
    */SecureSys-venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
fail_under = 60
show_missing = True

[coverage:xml]
output = coverage.xml
