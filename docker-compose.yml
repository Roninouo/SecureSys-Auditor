# SecureSys Auditor - Local Development Docker Compose
# Includes: PostgreSQL, Redis, Keycloak, Backend API, Celery Worker

version: '3.9'

services:
  # Keycloak IAM Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: securesys-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    command: start-dev --import-realm
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PostgreSQL for Keycloak (separate instance)
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: securesys-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger - Distributed Tracing (OpenTelemetry)
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: securesys-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: securesys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securesys_db}
      POSTGRES_USER: ${DB_USER:-securesys_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securesys_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securesys_user} -d ${DB_NAME:-securesys_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Message broker and cache
  redis:
    image: redis:7-alpine
    container_name: securesys-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securesys-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-for-local-only}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DB_NAME=${DB_NAME:-securesys_db}
      - DB_USER=${DB_USER:-securesys_user}
      - DB_PASSWORD=${DB_PASSWORD:-securesys_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # OIDC/Keycloak Configuration
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER:-http://keycloak:8080/realms/securesys}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-securesys-backend}
      # OpenTelemetry Configuration
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_SERVICE_NAME=securesys-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Webhook Configuration
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-false}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src/backend:/app  # Mount code for development
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --reload backend.wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Celery Worker - Async task processing
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securesys-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-for-local-only}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_NAME=${DB_NAME:-securesys_db}
      - DB_USER=${DB_USER:-securesys_user}
      - DB_PASSWORD=${DB_PASSWORD:-securesys_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./src/backend:/app:ro
      - backend_logs:/app/logs
    command: celery -A backend worker --loglevel=info --concurrency=2

  # Celery Beat - Scheduled tasks (optional)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securesys-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-for-local-only}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_NAME=${DB_NAME:-securesys_db}
      - DB_USER=${DB_USER:-securesys_user}
      - DB_PASSWORD=${DB_PASSWORD:-securesys_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./src/backend:/app:ro
    command: celery -A backend beat --loglevel=info

volumes:
  postgres_data:
    driver: local
  postgres_keycloak_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local
  backend_logs:
    driver: local

networks:
  default:
    name: securesys-network
