# SecureSys Auditor - Local Development Docker Compose
# Includes: PostgreSQL, Redis, Backend API, Celery Worker

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: securesys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securesys_db}
      POSTGRES_USER: ${DB_USER:-securesys_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securesys_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securesys_user} -d ${DB_NAME:-securesys_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Message broker and cache
  redis:
    image: redis:7-alpine
    container_name: securesys-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securesys-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-for-local-only}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - DB_NAME=${DB_NAME:-securesys_db}
      - DB_USER=${DB_USER:-securesys_user}
      - DB_PASSWORD=${DB_PASSWORD:-securesys_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src/backend:/app:ro  # Read-only mount for development
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 --reload backend.wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Celery Worker - Async task processing
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securesys-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-for-local-only}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_NAME=${DB_NAME:-securesys_db}
      - DB_USER=${DB_USER:-securesys_user}
      - DB_PASSWORD=${DB_PASSWORD:-securesys_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./src/backend:/app:ro
      - backend_logs:/app/logs
    command: celery -A backend worker --loglevel=info --concurrency=2

  # Celery Beat - Scheduled tasks (optional)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securesys-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-for-local-only}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_NAME=${DB_NAME:-securesys_db}
      - DB_USER=${DB_USER:-securesys_user}
      - DB_PASSWORD=${DB_PASSWORD:-securesys_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./src/backend:/app:ro
    command: celery -A backend beat --loglevel=info

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local
  backend_logs:
    driver: local

networks:
  default:
    name: securesys-network
