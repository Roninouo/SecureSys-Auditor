[flake8]
max-line-length = 120
extend-ignore = E203,W503
per-file-ignores =
    src/**/__init__.py:F401
    src/backend/**/migrations/*.py:E501,F401
    src/backend/**/tests/*.py:F401,B017
    src/backend/core/reports.py:E501
    scripts/*.py:E402,E501,F401,F541,B007
    tests/*.py:E402,E501,F401,F541,F841,B007,B017
exclude =
    .git,
    __pycache__,
    *.egg-info,
    .eggs,
    build,
    dist,
    venv,
    SecureSys-venv,
    migrations,
    node_modules

[isort]
profile = black
line_length = 120
skip = venv,SecureSys-venv,migrations,node_modules
known_django = django
known_first_party = core,backend,agent
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,FIRSTPARTY,LOCALFOLDER
