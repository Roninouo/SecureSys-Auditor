[flake8]
max-line-length = 120
extend-ignore = E203,W503
exclude =
    .git,
    __pycache__,
    *.egg-info,
    .eggs,
    build,
    dist,
    venv,
    SecureSys-venv,
    migrations,
    node_modules

[isort]
profile = black
line_length = 120
skip = venv,SecureSys-venv,migrations,node_modules
known_django = django
known_first_party = core,backend,agent
sections = FUTURE,STDLIB,THIRDPARTY,DJANGO,FIRSTPARTY,LOCALFOLDER
