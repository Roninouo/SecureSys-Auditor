apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: securesys-secrets
  namespace: securesys
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: securesys-secrets
    creationPolicy: Owner
  data:
  - secretKey: DJANGO_SECRET_KEY
    remoteRef:
      key: production/securesys/backend
      property: DJANGO_SECRET_KEY
  - secretKey: DB_USER
    remoteRef:
      key: production/securesys/database
      property: username
  - secretKey: DB_PASSWORD
    remoteRef:
      key: production/securesys/database
      property: password
  - secretKey: WEBHOOK_SECRET
    remoteRef:
      key: production/securesys/webhooks
      property: secret
