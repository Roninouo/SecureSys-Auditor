apiVersion: v1
kind: ServiceAccount
metadata:
  name: securesys-backend
  namespace: securesys
  labels:
    app.kubernetes.io/name: securesys-auditor
    app.kubernetes.io/component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: securesys-backend-role
  namespace: securesys
rules:
  # Allow reading ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading Secrets (for app secrets)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["securesys-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: securesys-backend-rolebinding
  namespace: securesys
subjects:
  - kind: ServiceAccount
    name: securesys-backend
    namespace: securesys
roleRef:
  kind: Role
  name: securesys-backend-role
  apiGroup: rbac.authorization.k8s.io
