apiVersion: apps/v1
kind: Deployment
metadata:
  name: securesys-worker
  namespace: securesys
  labels:
    app.kubernetes.io/name: securesys-auditor
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securesys-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: securesys-worker
        app.kubernetes.io/name: securesys-auditor
        app.kubernetes.io/component: worker
      annotations: {}
    spec:
      serviceAccountName: securesys-backend
      terminationGracePeriodSeconds: 120  # Allow time for task completion

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: securesys-worker
                topologyKey: kubernetes.io/hostname

      containers:
        # Main worker for scans queue
        - name: worker-scans
          image: securesys/backend:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "backend", "worker", "-l", "info", "-Q", "scans", "--concurrency=2"]

          envFrom:
            - configMapRef:
                name: securesys-config
            - secretRef:
                name: securesys-secrets

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - backend
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                # Graceful shutdown: stop accepting new tasks
                command: ["/bin/sh", "-c", "celery -A backend control cancel_consumer scans && sleep 30"]

        # Worker for reports queue
        - name: worker-reports
          image: securesys/backend:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "backend", "worker", "-l", "info", "-Q", "reports", "--concurrency=1"]

          envFrom:
            - configMapRef:
                name: securesys-config
            - secretRef:
                name: securesys-secrets

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: reports
              mountPath: /app/media/reports

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "celery -A backend control cancel_consumer reports && sleep 60"]

        # Worker for webhooks queue
        - name: worker-webhooks
          image: securesys/backend:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "backend", "worker", "-l", "info", "-Q", "webhooks", "--concurrency=4"]

          envFrom:
            - configMapRef:
                name: securesys-config
            - secretRef:
                name: securesys-secrets

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "celery -A backend control cancel_consumer webhooks && sleep 15"]

      volumes:
        - name: tmp
          emptyDir: {}
        - name: reports
          emptyDir: {}
