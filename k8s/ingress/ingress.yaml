apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securesys
  namespace: securesys
  labels:
    app.kubernetes.io/name: securesys-auditor
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS configuration
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.securesys.io wss://api.securesys.io" always;
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Body size (for scan payloads)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS (if needed at ingress level)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://securesys.io"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
spec:
  tls:
    - hosts:
        - securesys.io
        - api.securesys.io
      secretName: securesys-tls
  rules:
    # API backend
    - host: api.securesys.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securesys-backend
                port:
                  number: 8000
    
    # Frontend
    - host: securesys.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securesys-frontend
                port:
                  number: 80
