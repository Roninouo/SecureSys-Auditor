# Grafana Provisioning - Dashboards
apiVersion: 1

providers:
  - name: 'SecureSys Dashboards'
    orgId: 1
    folder: 'SecureSys Auditor'
    folderUid: 'securesys'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
