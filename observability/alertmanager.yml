# Alertmanager Configuration for SecureSys Auditor
# Integrates with PagerDuty, Slack, and email

global:
  # SMTP configuration for email alerts
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: 'alerts@securesys.io'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

  # PagerDuty integration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

  # Slack webhook
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Alert routing
route:
  # Default receiver
  receiver: 'default-receiver'
  
  # Group alerts by alertname, job, and severity
  group_by: ['alertname', 'job', 'severity']
  
  # Wait time before sending first notification
  group_wait: 30s
  
  # Time between notifications for same group
  group_interval: 5m
  
  # Time before repeating notification
  repeat_interval: 4h
  
  # Route critical alerts to PagerDuty immediately
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true
    
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 1m
      repeat_interval: 4h
    
    - match:
        team: integrations
      receiver: 'integrations-team'
    
    - match:
        team: platform
      receiver: 'platform-team'

# Notification receivers
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'ops@securesys.io'
        send_resolved: true

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ .Annotations.summary }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
          resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'

  - name: 'slack-critical'
    slack_configs:
      - channel: '#securesys-critical-alerts'
        send_resolved: true
        username: 'SecureSys Alertmanager'
        icon_emoji: ':rotating_light:'
        title: '{{ if eq .Status "firing" }}🔥 CRITICAL{{ else }}✅ RESOLVED{{ end }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
        actions:
          - type: button
            text: 'View in Grafana'
            url: '${GRAFANA_URL}/d/securesys-overview'
          - type: button
            text: 'View Runbook'
            url: '{{ .Annotations.runbook_url }}'

  - name: 'slack-warnings'
    slack_configs:
      - channel: '#securesys-alerts'
        send_resolved: true
        username: 'SecureSys Alertmanager'
        icon_emoji: ':warning:'
        title: '{{ if eq .Status "firing" }}⚠️ WARNING{{ else }}✅ RESOLVED{{ end }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}

  - name: 'platform-team'
    slack_configs:
      - channel: '#platform-team'
        send_resolved: true
    email_configs:
      - to: 'platform-team@securesys.io'

  - name: 'integrations-team'
    slack_configs:
      - channel: '#integrations-team'
        send_resolved: true
    email_configs:
      - to: 'integrations@securesys.io'

# Inhibition rules - suppress less severe alerts when more severe ones are firing
inhibit_rules:
  # If critical alert is firing, suppress warning for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']

  # If backend is down, suppress other backend alerts
  - source_match:
      alertname: 'HealthCheckFailing'
    target_match_re:
      alertname: '(SlowResponseTime|HighErrorRate|ScanProcessingStalled)'
    equal: ['job']

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
