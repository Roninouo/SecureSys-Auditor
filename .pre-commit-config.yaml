# Pre-commit hooks configuration
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# See https://pre-commit.com for more information

default_stages: [commit, push]
fail_fast: false

default_language_version:
  python: python3.10

repos:
  # =============================================================================
  # Secret Detection - CRITICAL for security
  # =============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
          - '--disable-plugin'
          - 'KeywordDetector'
        exclude: |
          (?x)^(
            \.env\.example|
            \.env\.production\.example|
            k8s/base/secrets\.local\.yaml\.template|
            docs/.*\.md|
            tests/.*\.py
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
        args:
          - '--verbose'
          - '--redact'

  # =============================================================================
  # Python Code Quality
  # =============================================================================
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: ['--line-length=120']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=120'
          - '--extend-ignore=E203,W503'
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions

  # =============================================================================
  # Security Static Analysis
  # =============================================================================
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args:
          - '-r'
          - '-ll'
          - '-f'
          - 'json'
          - '--exclude'
          - 'tests/,**/migrations/'

  # =============================================================================
  # General File Quality
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'production']

  # =============================================================================
  # YAML/JSON Validation
  # =============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        entry: python -X utf8 -m yamllint
        args: ['-c', '.yamllint.yml']
        exclude: |
          (?x)^(
            k8s/.*|
            keycloak/.*
          )$

# Configuration for detect-secrets
# Run: detect-secrets scan > .secrets.baseline
# to create a baseline of known false positives
